name: vortixadropgame
description: Vortixa Drop — offline neon decision tool.
publish_to: "none"
version: 1.0.1+7

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  audioplayers: ^6.5.1
  url_launcher: ^6.3.1
  webview_flutter: ^4.14.0
  webview_flutter_wkwebview: ^3.25.0

  # Boot-path networking / attribution (kine).
  http: ^1.5.0
  connectivity_plus: 7.0.0
  flutter_secure_storage: ^10.2.0
  device_info_plus: ">=12.2.0 <12.3.0"
  app_tracking_transparency: ^2.0.6
  appsflyer_sdk: ^6.18.0
  firebase_core: ">=4.14.0 <4.15.0"
  firebase_messaging: ^16.4.0
  firebase_app_check: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "assets/branding/icon.png"
  adaptive_icon_foreground: "assets/branding/icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#050510"
  min_sdk_android: 23

flutter:
  uses-material-design: true
  config:
    enable-swift-package-manager: false
  assets:
    - assets/branding/
    - assets/loading/
    - assets/gameplay/
    - assets/sounds/
    - assets/balls/
    - assets/onboarding/
